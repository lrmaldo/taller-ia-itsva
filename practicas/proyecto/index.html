<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis tareas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Mis tareas</h1>

    <!-- Punto de partida del día 3.
         A partir de aquí construyes la app con ayuda de la IA, por partes.
         No borres este comentario hasta terminar: te recuerda el orden.
         1) agregar tarea   2) listar   3) completar   4) borrar   5) guardar en localStorage -->

    <form id="form-tarea">
      <input id="titulo" type="text" placeholder="¿Qué hay que hacer?" required>
      <button type="submit">Agregar</button>
    </form>

    <ul id="lista-tareas"></ul>

    <p id="vacio">Todavía no hay tareas.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
