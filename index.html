<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Programación Asistida por IA · Jornada ISC'2026 · ITSVA</title>
  <meta name="description" content="Taller interactivo de programación asistida por IA con ejercicios autoevaluables. Jornada Académica ISC'2026, ITSVA.">
  <meta name="theme-color" content="#1e1b4b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Cpath d='M12 11 L7 16 L12 21 M20 11 L25 16 L20 21' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/tailwind.css">
  <style>
    kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .78em; padding: .1rem .4rem; border: 1px solid #cbd5e1; border-bottom-width: 2px; border-radius: .35rem; background: #f8fafc; color: #334155; white-space: nowrap; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88em; background: #f1f5f9; padding: .1rem .35rem; border-radius: .3rem; color: #4338ca; }
    pre code { background: none; padding: 0; color: inherit; }
    #nav { scrollbar-width: none; -ms-overflow-style: none; }
    #nav::-webkit-scrollbar { display: none; }
    html { scroll-behavior: smooth; }
    textarea { tab-size: 2; }
    details[open] summary { margin-bottom: .25rem; }
    .trama { background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.14) 1px, transparent 0); background-size: 22px 22px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

  <header class="relative overflow-hidden bg-gradient-to-br from-slate-950 via-indigo-950 to-indigo-800 text-white">
    <div class="trama absolute inset-0" aria-hidden="true"></div>
    <div class="relative mx-auto max-w-4xl px-4 py-10 sm:py-14">
      <p id="t-evento" class="text-sm font-semibold tracking-wide text-indigo-300"></p>
      <h1 id="t-titulo" class="mt-2 text-3xl font-bold leading-tight sm:text-4xl"></h1>
      <div class="mt-4 flex flex-wrap items-center gap-2 text-sm">
        <span class="rounded-full bg-white/10 px-3 py-1 text-indigo-100 ring-1 ring-inset ring-white/20" id="t-datos"></span>
        <span class="rounded-full bg-white/10 px-3 py-1 text-indigo-100 ring-1 ring-inset ring-white/20" id="t-stack"></span>
      </div>
      <p class="mt-3 text-sm text-indigo-200">Imparte: <span id="t-instructor" class="font-medium text-white"></span></p>
      <span id="modo-instructor" class="mt-3 hidden rounded-full bg-amber-400 px-3 py-1 text-xs font-bold text-amber-950">MODO INSTRUCTOR</span>

      <div class="mt-7 max-w-md rounded-2xl bg-white/10 p-4 ring-1 ring-inset ring-white/15">
        <div class="flex items-center justify-between text-sm font-medium text-indigo-100">
          <span>Tu progreso</span><span id="progreso-texto">—</span>
        </div>
        <div class="mt-2 h-2.5 w-full overflow-hidden rounded-full bg-white/20" role="progressbar" aria-label="Progreso de ejercicios">
          <div id="progreso-barra" class="h-full rounded-full bg-gradient-to-r from-emerald-400 to-teal-300 transition-all duration-500" style="width:0%"></div>
        </div>
        <p class="mt-1.5 text-xs text-indigo-300">Se guarda solo en este navegador.</p>
      </div>
    </div>
  </header>

  <nav class="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur-md" aria-label="Secciones del taller">
    <div id="nav" class="mx-auto flex max-w-4xl gap-1 overflow-x-auto px-3 py-2"></div>
  </nav>

  <main id="app" class="mx-auto max-w-4xl px-4 py-7 sm:py-9"></main>

  <footer class="border-t border-slate-200 bg-white">
    <div class="mx-auto max-w-4xl px-4 py-6 text-center text-xs leading-relaxed text-slate-500">
      Tecnológico Nacional de México · Instituto Tecnológico Superior de Valladolid<br>
      Jornada Académica ISC'2026 — Tecnologías Emergentes: IA, Desarrollo de Software y Nube
    </div>
  </footer>

  <noscript>
    <p class="p-6 text-center text-slate-700">Esta página necesita JavaScript para mostrar el contenido del taller.</p>
  </noscript>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
